function debts(){
  const m={};
  G.forEach(g=>g.o.forEach((id,i)=>{if(i&&!g.paid.includes(id)){const k=id+'|'+g.o[0];m[k]=(m[k]||0)+g.n}}));
  const out=[],ids=Object.keys(P);
  ids.forEach((a,i)=>ids.slice(i+1).forEach(b=>{const n=(m[a+'|'+b]||0)-(m[b+'|'+a]||0);if(n>0)out.push([a,b,n]);else if(n<0)out.push([b,a,-n])}));
  return out.sort((x,y)=>y[2]-x[2]);
}

  const d=debts();
  return '<h2>Кто кому торчит</h2>'+(d.length?d.map(([a,b,n])=>`<div class="card debt"><span>${P[a].e} <b>${N(a)}</b> → ${P[b].e} <b>${N(b)}</b></span><b class="mi">${n} ${CUR}</b></div>`).join('')+'<div class="note">Считаются только непогашенные долги, встречные суммы взаимно зачтены.</div>':'<div class="empty">Все в расчёте 🎉</div>');

const RK=['2','3','4','5','6','7','8','9','T','J','Q','K','A'],SY={s:'♠',h:'♥',d:'♦',c:'♣'},RD=s=>s==='h'||s==='d';
const RN=k=>k==='T'?'10':k;
const cardHtml=c=>`<span class="mc ${RD(c[1])?'red':''}"><i class="ix">${RN(c[0])}<b>${SY[c[1]]}</b></i><em class="ct">${'JQK'.includes(c[0])?c[0]:SY[c[1]]}</em></span>`;
function rate(cs){
  if(!cs||cs.length!==5)return '';
  const v=cs.map(c=>RK.indexOf(c[0])+2).sort((a,b)=>b-a),fl=cs.every(c=>c[1]===cs[0][1]),u=new Set(v);
  const wheel=v[0]===14&&v[1]===5,st=u.size===5&&(v[0]-v[4]===4||wheel);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.values(cnt).sort((a,b)=>b-a).join(''),su=SY[cs[0][1]];
  const nm=x=>x===14||x===1?'A':x>10?'JQK'[x-11]:x;
  const hi=wheel?5:v[0],rng=`от ${nm(hi-4)} до ${nm(hi)}`;
  if(st&&fl)return v[0]===14&&v[1]===13?`Роял-флеш ${su}`:`Стрит-флеш ${su}, ${rng}`;
  if(g==='41')return 'Каре';
  if(g==='32')return 'Фулл-хаус';
  if(fl)return `Флеш ${su}`;
  if(st)return `Стрит, ${rng}`;
  if(g==='311')return 'Тройка';
  if(g==='221')return 'Две пары';
  if(g==='2111')return 'Пара';
  return 'Старшая карта';
}

  h+=['d','h','c','s'].map(s=>`<div class="cg">${RK.map(k=>{const c=k+s;return `<button class="cd ${RD(s)?'red':''} ${f.bh.includes(c)?'on':''}" data-a="card" data-v="${c}">${RN(k)}${SY[s]}</button>`}).join('')}</div>`).join('');
  if(f.bh.length&&pids.length)h+=`<label>Чья рука (необязательно)</label><div class="pks">${pids.map(id=>`<button class="pk ${f.bp===id?'on':''}" data-a="owner" data-v="${id}">${P[id].e} ${N(id)}</button>`).join('')}</div>`;
  return h;
}

const HR=['Старшая','Пара','Две','Тройка','Стрит','Флеш','Фулл','Каре','Стрит-флеш','Роял'];
const hr=l=>HR.reduce((m,x,i)=>l.startsWith(x)?i:m,0);
function confetti(){

  document.body.appendChild(w);setTimeout(()=>w.remove(),3500);

function gf(){
  const ym=new Date().toLocaleDateString('sv').slice(0,7);
  return S.per==='month'?G.filter(g=>g.d.startsWith(ym)):S.per==='year'?G.filter(g=>g.d.startsWith(ym.slice(0,4))):G;

function stats(gs){
  const r={};Object.keys(P).forEach(id=>r[id]={id,g:0,w:0,bal:0,pl:0,st:0,mx:0});
  gs.forEach(g=>g.o.forEach((id,i)=>{const s=r[id];s.g++;s.pl+=i+1;s.bal+=delta(g,i);if(!i){s.w++;s.st++;s.mx=Math.max(s.mx,s.st)}else s.st=0}));
  return Object.values(r).filter(s=>s.g).sort((a,b)=>b.bal-a.bal);
}
function statView(){return statView0()+race()+shameView()+attView()+(G.length?'<button class="back" data-a="tv" style="margin-top:14px">📺 Режим телевизора</button>':'')}
function statView0(){
  const gs=gf(),st=stats(gs);
  let h='';
  if(!st.length)return h+'<div class="empty">За этот период игр нет.</div>';
  const rows=st.map((s,i)=>`<tr><td>${i===0?'👑 ':''}${P[s.id].e} ${N(s.id)}</td><td>${s.g}</td><td>${s.w}</td><td>${Math.round(s.w/s.g*100)}%</td><td class="${s.bal>=0?'pl':'mi'}">${money(s.bal)}</td><td>${(s.pl/s.g).toFixed(1)}</td><td style="text-align:left">${fm(s.id)}</td></tr>`).join('');
  h+=`<h2>Лидерборд</h2><div class="wrap"><table><tr><th>Игрок</th><th>Игр</th><th>Побед</th><th>Винрейт</th><th>Баланс</th><th>Ср. место</th><th>Форма</th></tr>${rows}</table></div>`;
  const rc=(e,t,s)=>`<div class="card" style="cursor:default"><span class="em">${e}</span><span><b>${t}</b><small>${s}</small></span></div>`;
  const big=gs.reduce((a,g)=>pot(g)>pot(a)?g:a,gs[0]),ser=st.reduce((a,s)=>s.mx>a.mx?s:a,st[0]);
  const last={};gs.forEach(g=>{const id=g.o[g.o.length-1];last[id]=(last[id]||0)+1});
  const lz=Object.entries(last).sort((a,b)=>b[1]-a[1])[0];
  h+='<h2>Рекорды</h2>'+rc('💰','Рекордный банк: '+pot(big)+' '+CUR,fdate(big.d)+', победил '+N(big.o[0]));
  if(ser.mx>1)h+=rc('🔥','Серия побед: '+ser.mx,P[ser.id].e+' '+N(ser.id));
  if(gs.length>2&&lz)h+=rc('🪦','Чаще всех вылетает первым',P[lz[0]].e+' '+N(lz[0])+', '+lz[1]+' раз');
  const hs=gs.filter(g=>g.bh&&g.bh.length===5).sort((a,b)=>hr(rate(b.bh))-hr(rate(a.bh))||(b.d>a.d?1:-1)).slice(0,10);
  if(hs.length)h+='<h2>Зал славы рук</h2>'+hs.map(g=>`<button class="card" data-a="gopen" data-v="${g.id}"><span class="hand" style="margin:0">${g.bh.map(cardHtml).join('')}</span><span><b>${rate(g.bh)}</b><small>${fdate(g.d)}${g.bp&&P[g.bp]?' · '+N(g.bp):''}</small></span></button>`).join('');
  return h;
}
function pStats(id){
  const gs=G.filter(g=>g.o.includes(id)),pls={},pts=[0];let bal=0,w=0,st=0,mx=0;
  gs.forEach(g=>{const i=g.o.indexOf(id);bal+=delta(g,i);pts.push(bal);pls[i+1]=(pls[i+1]||0)+1;if(!i){w++;st++;mx=Math.max(mx,st)}else st=0});
  return{gs,bal,w,mx,pts,fav:Object.entries(pls).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0]};
}
function spark(pts){
  if(pts.length<2)return '';
  const W=320,H=110,mn=Math.min(...pts,0),mxv=Math.max(...pts,0),rg=(mxv-mn)||1;
  const X=i=>i/(pts.length-1)*(W-12)+6,Y=v=>H-8-(v-mn)/rg*(H-16);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--gold)"/>`).join('')}</svg>`;
}
function profView(){
  const id=S.pid,p=P[id];if(!p){S.pid=null;return plView()}
  const s=pStats(id),n=s.gs.length;
  let h=`<button class="back" data-a="pback">‹ Игроки</button><div class="phead"><div class="av ${ring(id)}" style="background:${p.c};width:64px;height:64px;font-size:34px">${p.e}</div><h2 style="margin:0">${N(id)}</h2></div><div>${(badges()[id]||[]).map(b=>`<span class="bdg">${b}</span>`).join('')}</div>`;
  if(!n)return h+'<div class="empty">Пока ни одной игры.</div>';
  const tl=(a,b,c)=>`<div class="tile"><b${c?` class="${c}"`:''}>${a}</b><small>${b}</small></div>`;
  h+=`<div class="tiles">${tl(n,'игр')}${tl(s.w,'побед')}${tl(Math.round(s.w/n*100)+'%','винрейт')}${tl(money(s.bal),'баланс',s.bal>=0?'pl':'mi')}${tl((s.gs.reduce((a,g)=>a+g.o.indexOf(id)+1,0)/n).toFixed(1),'ср. место')}${tl(s.mx,'серия побед')}</div>`;
