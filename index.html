<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Покерный архив</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0d1711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Покер">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1e8;--surf:#fff;--surf2:#e3e9dc;--tx:#17251c;--mut:#5d7164;--gold:#a87b12;--red:#c0392b;--grn:#2e8b57;--line:#cfd9c8;--felt:#1f6b43;--felt2:#14472c;--rail:#4a2d1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1711;--surf:#15251b;--surf2:#1c3224;--tx:#f1ead4;--mut:#93a89a;--gold:#e3b84f;--red:#ec6a5e;--grn:#55c283;--line:#27412f}}
:root[data-theme="dark"]{--bg:#0d1711;--surf:#15251b;--surf2:#1c3224;--tx:#f1ead4;--mut:#93a89a;--gold:#e3b84f;--red:#ec6a5e;--grn:#55c283;--line:#27412f}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 Rubik,system-ui,sans-serif;min-height:100%}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font:italic 700 26px/1 "Playfair Display",Georgia,serif;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h1 i{color:var(--gold);font-style:normal}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button,.back,.nav button{font:500 14px Rubik,sans-serif;color:var(--tx);background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.tabs button{flex:1}
.tabs button.on{background:var(--felt);border-color:var(--felt);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{font:700 20px "Playfair Display",Georgia,serif;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mut);font-size:12px;padding:2px 0}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--tx);font:500 14px Rubik,sans-serif;position:relative;cursor:default;padding:0}
.day.has{background:var(--felt);color:#fff;cursor:pointer;border-color:var(--felt2)}
.day.has::after{content:attr(data-c);position:absolute;right:3px;bottom:2px;font-size:10px;color:#f4d27a}
.day.has.sel{outline:2px solid var(--gold);outline-offset:1px}
.day.today{border-color:var(--gold)}
.day.off{opacity:.35}
h2{font:700 18px "Playfair Display",Georgia,serif;margin:18px 0 8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;color:var(--tx);font:inherit}
.card .em{font-size:28px}
.card small{color:var(--mut);display:block}
.back{margin-bottom:10px}
.table{position:relative;height:460px;margin:6px 0 10px}
.felt{position:absolute;inset:11% 7%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%);border:10px solid var(--rail);box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.pot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;z-index:1}
.pot b{font:italic 700 26px "Playfair Display",Georgia,serif;color:#f4d27a;display:block}
.pot small{opacity:.85}
.chips{display:flex;justify-content:center;margin-bottom:4px}
.chip{width:22px;height:22px;border-radius:50%;margin:0 -3px;border:3px dashed #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seat{position:absolute;transform:translate(-50%,-50%);width:104px;text-align:center;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.seat.win .av{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.crown{position:absolute;top:-16px;font-size:20px}
.seat b{font-size:13px}
.seat small{font-size:11px;color:var(--mut)}
.pl{color:var(--grn)!important;font-weight:600}.mi{color:var(--red)!important;font-weight:600}
.st{font:500 13px Rubik,sans-serif;border-radius:999px;padding:7px 12px;min-height:34px;border:2px solid var(--line);background:var(--surf);color:var(--tx);cursor:pointer;margin-top:4px}
.st.ok{border-color:var(--grn)}.st.no{border-color:var(--red)}
.note{color:var(--mut);font-size:12px;margin-top:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
.debt{justify-content:space-between;cursor:default}
.empty{color:var(--mut);padding:14px 0}
.tabs button{padding:8px 2px}
.auth{margin-left:auto;font:500 13px Rubik,sans-serif;color:var(--tx);background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
input{width:100%;font:400 16px Rubik,sans-serif;color:var(--tx);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
label{display:block;color:var(--mut);font-size:13px;margin-top:6px}
.pks,.emo{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pk{position:relative;font:500 15px Rubik,sans-serif;color:var(--tx);background:var(--surf);border:2px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.pk.on{border-color:var(--gold)}
.pk i{position:absolute;top:-8px;right:-6px;background:var(--gold);color:#17251c;font:600 12px Rubik,sans-serif;font-style:normal;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center}
.emo button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);cursor:pointer}
.emo button.on{border-color:var(--gold)}
.primary{width:100%;font:600 16px Rubik,sans-serif;color:#fff;background:var(--felt);border:0;border-radius:12px;padding:13px;cursor:pointer;margin-top:6px}
.danger{background:none;border:0;color:var(--red);font:500 13px Rubik,sans-serif;cursor:pointer;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
span.st{cursor:default;display:inline-block}
.mc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:42px;background:#fbf8ee;color:#17251c;border-radius:5px;font:700 13px/1.1 Rubik,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mc.red{color:#c0392b}.mc b{font-size:15px;font-weight:700}
.hand{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hand .mc{width:46px;height:62px;font-size:18px}.hand .mc b{font-size:20px}
.hname{font:italic 700 18px "Playfair Display",Georgia,serif;color:var(--gold);margin:0 0 10px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.cd{font:600 15px Rubik,sans-serif;color:var(--tx);padding:9px 0;border-radius:8px;border:2px solid var(--line);background:var(--surf);cursor:pointer}
.cd.red{color:var(--red)}.cd.on{border-color:var(--gold);background:var(--surf2)}
.board{position:absolute;left:50%;top:63%;transform:translateX(-50%);z-index:1;text-align:center}
.board .hand{gap:3px;justify-content:center;margin:0}
.board .hand .mc{width:28px;height:40px;font-size:12px}.board .hand .mc b{font-size:13px}
.board small{display:block;color:#f4d27a;font-size:12px;margin-top:4px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font:italic 700 20px "Playfair Display",Georgia,serif}
.tile small{color:var(--mut);font-size:12px}
.phead{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.lnk{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--tx);font:inherit;text-align:left;cursor:pointer;padding:0}
.note2{margin:10px 0;padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;font-size:14px}
.card .hand .mc{width:30px;height:42px;font-size:13px}.card .hand .mc b{font-size:15px}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.cf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-70px) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
.crown{animation:drop .8s cubic-bezier(.3,1.5,.5,1) .3s both}
.seat .av{animation:pin .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0)*80ms)}
.chips .chip{animation:pin .5s cubic-bezier(.3,1.5,.5,1) both}
.chips .chip:nth-child(2){animation-delay:.15s}.chips .chip:nth-child(3){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.crown,.seat .av,.chips .chip{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://clytynprqonjkcbhueck.supabase.co','sb_publishable_10Wqa--s1u82r3dMzN_v9g_FIIRdJNE');
const CUR='₽',MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const COL=['#f0a35e','#c49a6c','#8fb0d8','#f2cf6b','#7fd39b','#d89bd6','#e08a8a','#8fd3d0'];
const EMO=['🦊','🐻','🐺','🦁','🐸','🐯','🐼','🐨','🐵','🐙','🦄','🐲','🦅','🦉','🐧','🐢','🦈','🐬','🦖','👽','🤡','😎','🤠','🥷','💀','👻','🤖','😈','🧙','🥸'];
let P={},G=[],ED=false,T='',L=false;
const S={tab:'cal',gid:null,form:null,login:false,pe:null,sel:null,em:'',pw:'',pn:'',per:'all',pid:null};
const nw=new Date();S.y=nw.getFullYear();S.m=nw.getMonth();
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=id=>esc(P[id].n);
const today=()=>new Date().toLocaleDateString('sv');
const money=v=>(v>0?'+':v<0?'−':'')+Math.abs(v)+' '+CUR;
const ds=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const pot=g=>g.o.reduce((a,id)=>a+g.s[id],0);
const delta=(g,i)=>i===0?pot(g)-g.s[g.o[0]]:-g.s[g.o[i]];
function say(m){T=m;render();setTimeout(()=>{T='';render()},3500)}

async function load(){
  const [a,b,c]=await Promise.all([SB.from('players').select('*').order('name'),SB.from('games').select('*').order('played_on').order('created_at'),SB.from('game_players').select('*')]);
  const er=a.error||b.error||c.error;
  if(er){L=true;return say('Не загрузилось: '+er.message)}
  P={};a.data.forEach(p=>P[p.id]={n:p.name,e:p.emoji,c:p.color});
  G=b.data.map(g=>{const r=c.data.filter(x=>x.game_id===g.id).sort((x,y)=>x.place-y.place);return{id:g.id,d:g.played_on,n:g.buy_in,s:Object.fromEntries(r.map(x=>[x.player_id,x.stake||g.buy_in||0])),o:r.map(x=>x.player_id),paid:r.filter(x=>x.paid).map(x=>x.player_id),bh:g.best_hand,bp:g.best_player,note:g.note||''}}).filter(g=>g.o.length);
  if(!S.sel&&G.length){S.sel=G[G.length-1].d;const p=S.sel.split('-');S.y=+p[0];S.m=+p[1]-1}
  L=true;render();
}

function render(){
  const tabs=[['cal','Календарь'],['stat','Статистика'],['pl','Игроки']];
  let h=`<h1><i>♠</i>Покерный архив<button class="auth" data-a="auth">${ED?'Выйти':'Вход'}</button></h1>`;
  if(S.login)h+=loginView();
  else if(!L)h+='<div class="empty">Загружаю…</div>';
  else{
    h+='<div class="tabs">'+tabs.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('')+'</div>';
    h+=S.tab==='cal'?(S.form?formView():S.hform?handView():S.gid?tableView():calView()):S.tab==='stat'?statView():S.pid?profView():plView();
  }
  if(T)h+=`<div class="toast">${esc(T)}</div>`;
  $.innerHTML=h;
}

function loginView(){
  return `<h2>Вход для редактора</h2><label>Почта</label><input id="em" type="email" autocomplete="username" value="${esc(S.em)}"><label>Пароль</label><input id="pw" type="password" autocomplete="current-password" value="${esc(S.pw)}"><button class="primary" data-a="login">Войти</button><button class="danger" data-a="auth">Отмена</button>`;
}

function calView(){
  const {y,m}=S,off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),td=today();
  let h=(ED?'<button class="primary" data-a="newgame" style="margin:0 0 12px">+ Записать игру</button>':'')+`<div class="nav"><button data-a="mo" data-v="-1">‹</button><b>${MON[m]} ${y}</b><button data-a="mo" data-v="1">›</button></div><div class="grid">`;
  h+=['пн','вт','ср','чт','пт','сб','вс'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const k=ds(y,m,d),c=G.filter(g=>g.d===k).length;
    h+=`<button class="day ${c?'has':'off'} ${k===S.sel?'sel':''} ${k===td?'today':''}" ${c?`data-a="sel" data-v="${k}" data-c="${c>1?'×'+c:''}"`:'disabled'}>${d}</button>`;
  }
  h+='</div>';
  const gs=G.filter(g=>g.d===S.sel);
  if(gs.length){
    h+=`<h2>${fdate(S.sel)}</h2>`+gs.map((g,i)=>{const w=P[g.o[0]],open=g.o.slice(1).filter(x=>!g.paid.includes(x)).length;
      return `<button class="card" data-a="game" data-v="${g.id}"><span class="em">${w.e}</span><span><b>${gs.length>1?'Игра '+(i+1)+': ':''}победил ${N(g.o[0])}</b><small>банк ${pot(g)} ${CUR}, игроков ${g.o.length}, по ${g.s[g.o[0]]} ${CUR}</small></span></button>`}).join('');
  } else h+=`<div class="empty">${G.length?'Тапни по подсвеченной дате, чтобы открыть игры.':(ED?'Игр пока нет. Добавь игроков во вкладке «Игроки» и жми «Записать игру».':'Игр пока нет.')}</div>`;
  return h;
}

function tableView(){
  const g=G.find(x=>x.id===S.gid);if(!g){S.gid=null;return calView()}
  const k=g.o.length;
  let h=`<button class="back" data-a="close">‹ ${fdate(g.d)}</button><div class="table"><div class="felt"></div>`;
  h+=`<div class="pot"><div class="chips">${['#c0392b','#2563a8','#1b1b1b'].map(c=>`<span class="chip" style="background:${c}"></span>`).join('')}</div><b>${pot(g)} ${CUR}</b><small>по ${g.s[g.o[0]]} ${CUR}</small></div>`;
  if(g.bh&&g.bh.length===5)h+=`<div class="board"><div class="hand">${g.bh.map(cardHtml).join('')}</div><small>${rate(g.bh)}${g.bp&&P[g.bp]?' · '+N(g.bp):''}</small></div>`;
  g.o.forEach((id,i)=>{
    const a=(-90+i*360/k)*Math.PI/180,x=50+41*Math.cos(a),y=50+41*Math.sin(a),p=P[id],paid=g.paid.includes(id),tg=ED?'button':'span';
    h+=`<div class="seat ${i===0?'win':''}" style="left:${x}%;top:${y}%;--i:${i}">${i===0?'<span class="crown">👑</span>':''}<div class="av" style="background:${p.c}">${p.e}</div><b>${N(id)}</b><small class="${i===0?'pl':'mi'}">${money(delta(g,i))}</small><small>${i===0?'победитель':(i+1)+' место'}</small></div>`;
  });
  return h+'</div>'+(g.note?`<div class="note2">💬 ${esc(g.note)}</div>`:'')+'<button class="back" data-a="share">📸 Поделиться</button>'+(ED?` <button class="back" data-a="editgame">✏️ Править</button> <button class="back" data-a="hand">🃏 Рука</button><br><button class="danger" data-a="delgame">Удалить игру</button>`:'');
}

function formView(){
  const f=S.form,ids=Object.keys(P);
  if(!ids.length)return '<button class="back" data-a="cancel">‹ Назад</button><div class="empty">Сначала добавь игроков во вкладке «Игроки».</div>';
  return `<button class="back" data-a="cancel">‹ Отмена</button><h2>${f.id?'Правка игры':'Новая игра'}</h2><label>Дата</label><input id="fd" type="date" value="${f.d}"><label>Ставка с каждого, ${CUR}</label><input id="fn" type="number" inputmode="numeric" value="${f.n}"><label>Места: тапай игроков по порядку, сначала победитель, потом 2-е место и так далее. Повторный тап убирает.</label><div class="pks">${ids.map(id=>{const i=f.order.indexOf(id);return `<button class="pk ${i>=0?'on':''}" data-a="pick" data-v="${id}">${P[id].e} ${N(id)}${i>=0?`<i>${i+1}</i>`:''}</button>`}).join('')}</div>${f.order.length?`<div class="hname">Банк: ${(+f.n||0)*f.order.length} ${CUR}</div>`:''}${picker(f,f.order)}<label>Заметка (необязательно)</label><input id="fnote" maxlength="200" value="${esc(f.note||'')}"><button class="primary" data-a="savegame">Сохранить игру</button>`;
}

function plView(){
  const ids=Object.keys(P);
  let h='<h2>Игроки</h2>'+(ids.length?ids.map(id=>`<div class="card debt"><button class="lnk" data-a="prof" data-v="${id}"><span class="em">${P[id].e}</span><b>${N(id)}</b></button>${ED?`<button class="danger" style="margin:0" data-a="delpl" data-v="${id}">Удалить</button>`:''}</div>`).join(''):'<div class="empty">Пока никого.</div>');
  if(ED)h+=`<h2>Новый игрок</h2><label>Имя</label><input id="pn" value="${esc(S.pn)}"><label>Аватарка</label><div class="emo">${EMO.map(x=>`<button class="${S.pe===x?'on':''}" data-a="pe" data-v="${x}">${x}</button>`).join('')}</div><button class="primary" data-a="addpl">Добавить</button>`;
  return h;
}

function debts(){
  const m={};
  G.forEach(g=>g.o.forEach((id,i)=>{if(i&&!g.paid.includes(id)){const k=id+'|'+g.o[0];m[k]=(m[k]||0)+g.n}}));
  const out=[],ids=Object.keys(P);
  ids.forEach((a,i)=>ids.slice(i+1).forEach(b=>{const n=(m[a+'|'+b]||0)-(m[b+'|'+a]||0);if(n>0)out.push([a,b,n]);else if(n<0)out.push([b,a,-n])}));
  return out.sort((x,y)=>y[2]-x[2]);
}
function debtView(){
  const d=debts();
  return '<h2>Кто кому торчит</h2>'+(d.length?d.map(([a,b,n])=>`<div class="card debt"><span>${P[a].e} <b>${N(a)}</b> → ${P[b].e} <b>${N(b)}</b></span><b class="mi">${n} ${CUR}</b></div>`).join('')+'<div class="note">Считаются только непогашенные долги, встречные суммы взаимно зачтены.</div>':'<div class="empty">Все в расчёте 🎉</div>');
}

const RK=['2','3','4','5','6','7','8','9','T','J','Q','K','A'],SY={s:'♠',h:'♥',d:'♦',c:'♣'},RD=s=>s==='h'||s==='d';
const RN=k=>k==='T'?'10':k;
const cardHtml=c=>`<span class="mc ${RD(c[1])?'red':''}">${RN(c[0])}<b>${SY[c[1]]}</b></span>`;
function rate(cs){
  if(!cs||cs.length!==5)return '';
  const v=cs.map(c=>RK.indexOf(c[0])+2).sort((a,b)=>b-a),fl=cs.every(c=>c[1]===cs[0][1]),u=new Set(v);
  const wheel=v[0]===14&&v[1]===5,st=u.size===5&&(v[0]-v[4]===4||wheel);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.values(cnt).sort((a,b)=>b-a).join(''),su=SY[cs[0][1]];
  const nm=x=>x===14||x===1?'A':x>10?'JQK'[x-11]:x;
  const hi=wheel?5:v[0],rng=`от ${nm(hi-4)} до ${nm(hi)}`;
  if(st&&fl)return v[0]===14&&v[1]===13?`Роял-флеш ${su}`:`Стрит-флеш ${su}, ${rng}`;
  if(g==='41')return 'Каре';
  if(g==='32')return 'Фулл-хаус';
  if(fl)return `Флеш ${su}`;
  if(st)return `Стрит, ${rng}`;
  if(g==='311')return 'Тройка';
  if(g==='221')return 'Две пары';
  if(g==='2111')return 'Пара';
  return 'Старшая карта';
}
function picker(f,pids){
  const r=rate(f.bh);
  let h=`<label>Лучшая рука на столе (необязательно): выбери 5 карт, выбрано ${f.bh.length}/5</label><div class="hand">${f.bh.map(cardHtml).join('')}</div>${r?`<div class="hname">${r}</div>`:''}`;
  h+=['d','h','c','s'].map(s=>`<div class="cg">${RK.map(k=>{const c=k+s;return `<button class="cd ${RD(s)?'red':''} ${f.bh.includes(c)?'on':''}" data-a="card" data-v="${c}">${RN(k)}${SY[s]}</button>`}).join('')}</div>`).join('');
  if(f.bh.length&&pids.length)h+=`<label>Чья рука (необязательно)</label><div class="pks">${pids.map(id=>`<button class="pk ${f.bp===id?'on':''}" data-a="owner" data-v="${id}">${P[id].e} ${N(id)}</button>`).join('')}</div>`;
  return h;
}
function handView(){
  const g=G.find(x=>x.id===S.gid);
  return `<button class="back" data-a="hcancel">‹ Назад</button><h2>Лучшая рука</h2>${picker(S.hform,g.o)}<button class="primary" data-a="hsave">Сохранить</button>${g.bh?'<button class="danger" data-a="hclear">Убрать руку</button>':''}`;
}

const HR=['Старшая','Пара','Две','Тройка','Стрит','Флеш','Фулл','Каре','Стрит-флеш','Роял'];
const hr=l=>HR.reduce((m,x,i)=>l.startsWith(x)?i:m,0);
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const w=document.createElement('div');w.className='cf';
  const cols=['#e3b84f','#f4ecd0','#c0392b','#2563a8','#55c283'];
  for(let i=0;i<46;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.2}s`;w.appendChild(p)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),3500);
}
function gf(){
  const ym=new Date().toLocaleDateString('sv').slice(0,7);
  return S.per==='month'?G.filter(g=>g.d.startsWith(ym)):S.per==='year'?G.filter(g=>g.d.startsWith(ym.slice(0,4))):G;
}
function stats(gs){
  const r={};Object.keys(P).forEach(id=>r[id]={id,g:0,w:0,bal:0,pl:0,st:0,mx:0});
  gs.forEach(g=>g.o.forEach((id,i)=>{const s=r[id];s.g++;s.pl+=i+1;s.bal+=delta(g,i);if(!i){s.w++;s.st++;s.mx=Math.max(s.mx,s.st)}else s.st=0}));
  return Object.values(r).filter(s=>s.g).sort((a,b)=>b.bal-a.bal);
}
function statView(){
  const gs=gf(),st=stats(gs);
  let h=`<div class="tabs">${[['all','Всё время'],['year','Год'],['month','Месяц']].map(x=>`<button data-a="per" data-v="${x[0]}" class="${S.per===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
  if(!st.length)return h+'<div class="empty">За этот период игр нет.</div>';
  const rows=st.map((s,i)=>`<tr><td>${i===0?'👑 ':''}${P[s.id].e} ${N(s.id)}</td><td>${s.g}</td><td>${s.w}</td><td>${Math.round(s.w/s.g*100)}%</td><td class="${s.bal>=0?'pl':'mi'}">${money(s.bal)}</td><td>${(s.pl/s.g).toFixed(1)}</td></tr>`).join('');
  h+=`<h2>Лидерборд</h2><div class="wrap"><table><tr><th>Игрок</th><th>Игр</th><th>Побед</th><th>Винрейт</th><th>Баланс</th><th>Ср. место</th></tr>${rows}</table></div>`;
  const rc=(e,t,s)=>`<div class="card" style="cursor:default"><span class="em">${e}</span><span><b>${t}</b><small>${s}</small></span></div>`;
  const big=gs.reduce((a,g)=>pot(g)>pot(a)?g:a,gs[0]),ser=st.reduce((a,s)=>s.mx>a.mx?s:a,st[0]);
  const last={};gs.forEach(g=>{const id=g.o[g.o.length-1];last[id]=(last[id]||0)+1});
  const lz=Object.entries(last).sort((a,b)=>b[1]-a[1])[0];
  h+='<h2>Рекорды</h2>'+rc('💰','Рекордный банк: '+pot(big)+' '+CUR,fdate(big.d)+', победил '+N(big.o[0]));
  if(ser.mx>1)h+=rc('🔥','Серия побед: '+ser.mx,P[ser.id].e+' '+N(ser.id));
  if(gs.length>2&&lz)h+=rc('🪦','Чаще всех вылетает первым',P[lz[0]].e+' '+N(lz[0])+', '+lz[1]+' раз');
  const hs=gs.filter(g=>g.bh&&g.bh.length===5).sort((a,b)=>hr(rate(b.bh))-hr(rate(a.bh))||(b.d>a.d?1:-1)).slice(0,10);
  if(hs.length)h+='<h2>Зал славы рук</h2>'+hs.map(g=>`<button class="card" data-a="gopen" data-v="${g.id}"><span class="hand" style="margin:0">${g.bh.map(cardHtml).join('')}</span><span><b>${rate(g.bh)}</b><small>${fdate(g.d)}${g.bp&&P[g.bp]?' · '+N(g.bp):''}</small></span></button>`).join('');
  return h;
}
function pStats(id){
  const gs=G.filter(g=>g.o.includes(id)),pls={},pts=[0];let bal=0,w=0,st=0,mx=0;
  gs.forEach(g=>{const i=g.o.indexOf(id);bal+=delta(g,i);pts.push(bal);pls[i+1]=(pls[i+1]||0)+1;if(!i){w++;st++;mx=Math.max(mx,st)}else st=0});
  return{gs,bal,w,mx,pts,fav:Object.entries(pls).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0]};
}
function spark(pts){
  if(pts.length<2)return '';
  const W=320,H=110,mn=Math.min(...pts,0),mxv=Math.max(...pts,0),rg=(mxv-mn)||1;
  const X=i=>i/(pts.length-1)*(W-12)+6,Y=v=>H-8-(v-mn)/rg*(H-16);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/><polyline fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--gold)"/>`).join('')}</svg>`;
}
function profView(){
  const id=S.pid,p=P[id];if(!p){S.pid=null;return plView()}
  const s=pStats(id),n=s.gs.length;
  let h=`<button class="back" data-a="pback">‹ Игроки</button><div class="phead"><div class="av" style="background:${p.c};width:64px;height:64px;font-size:34px">${p.e}</div><h2 style="margin:0">${N(id)}</h2></div>`;
  if(!n)return h+'<div class="empty">Пока ни одной игры.</div>';
  const tl=(a,b,c)=>`<div class="tile"><b${c?` class="${c}"`:''}>${a}</b><small>${b}</small></div>`;
  h+=`<div class="tiles">${tl(n,'игр')}${tl(s.w,'побед')}${tl(Math.round(s.w/n*100)+'%','винрейт')}${tl(money(s.bal),'баланс',s.bal>=0?'pl':'mi')}${tl((s.gs.reduce((a,g)=>a+g.o.indexOf(id)+1,0)/n).toFixed(1),'ср. место')}${tl(s.mx,'серия побед')}</div>`;
  h+=`<h2>Баланс по играм</h2><div class="card" style="cursor:default;display:block">${spark(s.pts)}</div><div class="note">Чаще всего занимает ${s.fav[0]} место (${s.fav[1]} раз).</div>`;
  const hs=s.gs.filter(g=>g.bp===id&&g.bh&&g.bh.length===5);
  if(hs.length)h+='<h2>Его руки</h2>'+hs.map(g=>`<button class="card" data-a="gopen" data-v="${g.id}"><span class="hand" style="margin:0">${g.bh.map(cardHtml).join('')}</span><span><b>${rate(g.bh)}</b><small>${fdate(g.d)}</small></span></button>`).join('');
  h+='<h2>Игры</h2>'+s.gs.slice().reverse().slice(0,15).map(g=>{const i=g.o.indexOf(id),dl=delta(g,i);return `<button class="card debt" data-a="gopen" data-v="${g.id}" style="cursor:pointer"><span>${fdate(g.d)} · ${i===0?'🥇 победа':(i+1)+' место'}</span><b class="${dl>=0?'pl':'mi'}">${money(dl)}</b></button>`}).join('');
  return h;
}
async function saveEdit(f){
  if(!f.d||!(f.n>0)||f.order.length<2)return say('Нужны дата, ставка и минимум 2 игрока');
  if(f.bh.length&&f.bh.length!==5)return say('Рука: нужно ровно 5 карт или ни одной');
  const g=G.find(x=>x.id===f.id),old=g.o.map((id,i)=>({game_id:g.id,player_id:id,place:i+1,paid:true}));
  const u=await SB.from('games').update({played_on:f.d,buy_in:f.n,note:f.note||null,best_hand:f.bh.length?f.bh:null,best_player:f.bh.length&&f.order.includes(f.bp)?f.bp:null}).eq('id',f.id);
  if(u.error)return say(u.error.message);
  const d=await SB.from('game_players').delete().eq('game_id',f.id);
  if(d.error)return say(d.error.message);
  const q=await SB.from('game_players').insert(f.order.map((id,i)=>({game_id:f.id,player_id:id,place:i+1,paid:true})));
  if(q.error){await SB.from('game_players').insert(old);await load();return say('Не сохранилось: '+q.error.message)}
  const p=f.d.split('-');S.y=+p[0];S.m=+p[1]-1;S.sel=f.d;S.form=null;
  await load();S.gid=f.id;render();
}
async function shareCard(){
  const g=G.find(x=>x.id===S.gid);if(!g)return;
  try{await document.fonts.ready}catch(e){}
  const hand=g.bh&&g.bh.length===5,W=1080,y0=770+(hand?290:0),H=y0+(g.o.length-1)*96+30;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const bg=x.createRadialGradient(W/2,H*.3,80,W/2,H/2,H*.85);bg.addColorStop(0,'#21704a');bg.addColorStop(1,'#08170f');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.strokeStyle='#e3b84f';x.lineWidth=6;x.strokeRect(28,28,W-56,H-56);
  x.textAlign='center';x.fillStyle='#e3b84f';x.font='italic 700 60px "Playfair Display",Georgia,serif';x.fillText('♠ Покерный архив',W/2,130);
  x.fillStyle='#f4ecd0';x.font='500 38px Rubik,sans-serif';x.fillText(fdate(g.d),W/2,190);
  const w=P[g.o[0]];
  x.font='80px sans-serif';x.fillText('👑',W/2,330);
  x.fillStyle=w.c;x.beginPath();x.arc(W/2,440,90,0,7);x.fill();
  x.fillStyle='#17251c';x.font='100px sans-serif';x.fillText(w.e,W/2,475);
  x.fillStyle='#f4ecd0';x.font='700 66px Rubik,sans-serif';x.fillText(w.n,W/2,600);
  x.fillStyle='#55c283';x.font='700 54px Rubik,sans-serif';x.fillText(money(delta(g,0)),W/2,670);
  x.fillStyle='#f4ecd0';x.font='400 34px Rubik,sans-serif';x.fillText('банк '+pot(g)+' '+CUR+', игроков '+g.o.length,W/2,720);
  if(hand){
    const cw=110,ch=150,gp=16,x0=(W-(5*cw+4*gp))/2,y=770;
    g.bh.forEach((cd,i)=>{const px=x0+i*(cw+gp);x.fillStyle='#fbf8ee';x.beginPath();(x.roundRect?x.roundRect.bind(x):x.rect.bind(x))(px,y,cw,ch,12);x.fill();x.fillStyle=RD(cd[1])?'#c0392b':'#17251c';x.font='700 52px Rubik,sans-serif';x.fillText(RN(cd[0]),px+cw/2,y+68);x.font='56px Rubik,sans-serif';x.fillText(SY[cd[1]],px+cw/2,y+130)});
    x.fillStyle='#f4d27a';x.font='italic 700 40px "Playfair Display",Georgia,serif';x.fillText(rate(g.bh)+(g.bp&&P[g.bp]?' · '+P[g.bp].n:''),W/2,y+215);
  }
  g.o.slice(1).forEach((id,i)=>{
    const y=y0+i*96;x.textAlign='left';x.fillStyle='#f4ecd0';x.font='500 44px Rubik,sans-serif';x.fillText((i+2)+'. '+P[id].e+' '+P[id].n,110,y);
    x.textAlign='right';x.fillStyle='#ec6a5e';x.fillText(money(delta(g,i+1)),W-110,y);
  });
  const blob=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([blob],'poker-'+g.d+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();say('Картинка скачана');
}
async function saveGame(){
  const f=S.form;
  if(f.id)return saveEdit(f);
  if(!f.d||!(f.n>0)||f.order.length<2)return say('Нужны дата, ставка и минимум 2 игрока');
  if(f.bh.length&&f.bh.length!==5)return say('Рука: нужно ровно 5 карт или ни одной');
  const r=await SB.from('games').insert({played_on:f.d,buy_in:f.n,note:f.note||null,best_hand:f.bh.length?f.bh:null,best_player:f.bh.length&&f.order.includes(f.bp)?f.bp:null}).select().single();
  if(r.error)return say(r.error.message);
  const rows=f.order.map((id,i)=>({game_id:r.data.id,player_id:id,place:i+1,paid:true}));
  const q=await SB.from('game_players').insert(rows);
  if(q.error){await SB.from('games').delete().eq('id',r.data.id);return say(q.error.message)}
  const p=f.d.split('-');S.y=+p[0];S.m=+p[1]-1;S.sel=f.d;S.form=null;
  await load();S.gid=r.data.id;render();confetti();
}
async function addPlayer(){
  const n=S.pn.trim();if(!n)return say('Введи имя');
  const r=await SB.from('players').insert({name:n,emoji:S.pe||'🦊',color:COL[Object.keys(P).length%COL.length]});
  if(r.error)return say(r.error.message);
  S.pn='';S.pe=null;await load();
}

$.addEventListener('input',e=>{
  const i=e.target.id,v=e.target.value;
  if(i==='fd')S.form.d=v;else if(i==='fn')S.form.n=+v;else if(i==='fnote')S.form.note=v;else if(i==='em')S.em=v;else if(i==='pw')S.pw=v;else if(i==='pn')S.pn=v;
});
$.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='tab'){S.tab=v;S.gid=null;S.form=null;S.hform=null;S.pid=null}
  else if(a==='mo'){S.m+=+v;if(S.m<0){S.m=11;S.y--}if(S.m>11){S.m=0;S.y++}}
  else if(a==='sel')S.sel=v;
  else if(a==='game'){S.gid=v;setTimeout(confetti,60)}
  else if(a==='close')S.gid=null;
  else if(a==='auth'){if(ED){await SB.auth.signOut();S.tab='cal';S.form=null}else S.login=!S.login}
  else if(a==='login'){
    const r=await SB.auth.signInWithPassword({email:S.em.trim(),password:S.pw});
    if(r.error)return say('Не пустило: '+r.error.message);
    S.login=false;S.pw='';
  }
  else if(a==='pay'&&ED){
    const g=G.find(x=>x.id===S.gid),i=g.paid.indexOf(v),val=i<0;
    val?g.paid.push(v):g.paid.splice(i,1);render();
    const r=await SB.from('game_players').update({paid:val}).eq('game_id',g.id).eq('player_id',v);
    if(r.error){say(r.error.message);load()}
    return;
  }
  else if(a==='newgame')S.form={d:S.sel||today(),n:G.length?Math.max(...Object.values(G[G.length-1].s)):500,order:[],bh:[],bp:null,st:{},note:''};
  else if(a==='pick'){const o=S.form.order,i=o.indexOf(v);i<0?o.push(v):o.splice(i,1)}
  else if(a==='cancel')S.form=null;
  else if(a==='savegame')return saveGame();
  else if(a==='delgame'){
    if(!confirm('Удалить эту игру?'))return;
    const r=await SB.from('games').delete().eq('id',S.gid);
    if(r.error)return say(r.error.message);
    S.gid=null;await load();return;
  }
  else if(a==='card'){const f=S.hform||S.form,i=f.bh.indexOf(v);if(i>=0)f.bh.splice(i,1);else if(f.bh.length<5)f.bh.push(v);else return say('Максимум 5 карт')}
  else if(a==='owner'){const f=S.hform||S.form;f.bp=f.bp===v?null:v}
  else if(a==='hand'){const g=G.find(x=>x.id===S.gid);S.hform={bh:[...(g.bh||[])],bp:g.bp||null}}
  else if(a==='hcancel')S.hform=null;
  else if(a==='hsave'||a==='hclear'){
    const f=S.hform;if(a==='hclear'){f.bh=[];f.bp=null}
    if(f.bh.length&&f.bh.length!==5)return say('Нужно ровно 5 карт');
    const r=await SB.from('games').update({best_hand:f.bh.length?f.bh:null,best_player:f.bh.length?f.bp:null}).eq('id',S.gid);
    if(r.error)return say(r.error.message);
    S.hform=null;await load();return;
  }
  else if(a==='delpl'){
    const c=G.filter(g=>g.o.includes(v)).length;
    if(c)return say('У него игр: '+c+'. Сначала удали эти игры');
    if(!confirm('Удалить игрока '+P[v].n+'?'))return;
    const r=await SB.from('players').delete().eq('id',v);
    if(r.error)return say(r.error.message);
    await load();return;
  }
  else if(a==='prof')S.pid=v;
  else if(a==='pback')S.pid=null;
  else if(a==='gopen'){S.tab='cal';S.pid=null;S.gid=v;setTimeout(confetti,60)}
  else if(a==='per')S.per=v;
  else if(a==='share')return shareCard();
  else if(a==='editgame'){const g=G.find(x=>x.id===S.gid);S.form={id:g.id,d:g.d,n:g.n||g.s[g.o[0]],order:[...g.o],bh:[...(g.bh||[])],bp:g.bp||null,st:{},note:g.note||''}}
  else if(a==='pe')S.pe=v;
  else if(a==='addpl')return addPlayer();
  render();
});
SB.auth.onAuthStateChange((_e,s)=>{ED=!!s;render()});
render();load();
